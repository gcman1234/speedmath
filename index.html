<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>速算练习</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">

    <!-- 模块选择页 -->
    <section id="screen-modules" class="screen active">
      <h1>速算练习</h1>
      <p class="subtitle">选择一个模块开始练习</p>
      <div class="module-grid" id="module-grid"></div>
    </section>

    <!-- 答题页 -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-top">
        <button class="btn-quit" id="btn-quit">✕ 退出</button>
        <span id="progress">第 1 / 10 题</span>
        <span id="score">已答对 0</span>
      </div>
      <div class="question" id="question">? + ? =</div>

      <!-- 键盘输入型答案区 -->
      <div class="answer" id="answer">?</div>
      <div class="keypad" id="keypad">
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key key-util" data-k="del">⌫</button>
        <button class="key" data-k="0">0</button>
        <button class="key key-util" data-k="ok">✓</button>
      </div>

      <!-- 四选一型答案区 -->
      <div class="choices" id="choices"></div>

      <div class="feedback" id="feedback"></div>
    </section>

    <!-- 结算页 -->
    <section id="screen-result" class="screen">
      <h2 id="result-title">本局成绩</h2>
      <div class="result-score" id="result-score">0 / 10</div>
      <div class="result-detail" id="result-detail"></div>
      <button class="btn btn-primary" id="btn-again">再来一局</button>
      <button class="btn btn-secondary" id="btn-home">选择其他模块</button>
    </section>

  </main>

  <!-- 模块注册表（必须先加载） -->
  <script src="js/modules/registry.js"></script>
  <!-- 练习模块：新增模块时在下方添加一行 <script src="js/modules/xxx.js"></script> -->
  <script src="js/modules/addition.js"></script>
  <!-- 应用外壳 -->
  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EBF7EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>速算练习</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">

    <!-- 模块选择页 -->
    <section id="screen-modules" class="screen active">
      <div class="logo">算</div>
      <h1>速算练习</h1>
      <p class="subtitle">选择一个模块开始练习</p>
      <div class="module-grid" id="module-grid"></div>
    </section>

    <!-- 答题页（布局高度还原参考图） -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-top">
        <span id="progress">1 / 10</span>
        <span class="timer">⏱ <span id="timer">0:00</span></span>
      </div>

      <div class="question-wrap">
        <div class="question"><span id="question-text">? + ? =</span><span class="q-answer" id="q-answer"></span></div>
        <div class="feedback" id="feedback"></div>
        <div class="grade-line" id="grade-line"></div>
      </div>

      <div class="action-row" id="action-row">
        <button class="round-btn" id="btn-restart">重开</button>
        <button class="round-btn" id="btn-ok">确定</button>
      </div>

      <!-- 键盘输入型：固定键盘面板 -->
      <div class="keypad-wrap" id="keypad-wrap">
        <div class="keypad">
          <button class="key" data-k="sign">±</button>
          <button class="key" data-k="clear">清空</button>
          <button class="key" data-k="del">退格</button>
          <button class="key" data-k="1">1</button>
          <button class="key" data-k="2">2</button>
          <button class="key" data-k="3">3</button>
          <button class="key" data-k="4">4</button>
          <button class="key" data-k="5">5</button>
          <button class="key" data-k="6">6</button>
          <button class="key" data-k="7">7</button>
          <button class="key" data-k="8">8</button>
          <button class="key" data-k="9">9</button>
          <button class="key" data-k=".">.</button>
          <button class="key" data-k="0">0</button>
          <button class="key" data-k="ok">确定</button>
        </div>
      </div>

      <!-- 四选一型（选择题模块用） -->
      <div class="choices" id="choices"></div>
    </section>

    <!-- 结算页 -->
    <section id="screen-result" class="screen">
      <h2 id="result-title">本局成绩</h2>
      <div class="result-score" id="result-score">0 / 10</div>
      <div class="result-detail" id="result-detail"></div>
      <button class="btn btn-primary" id="btn-again">再来一局</button>
      <button class="btn btn-secondary" id="btn-home">选择其他模块</button>
    </section>

  </main>

  <!-- 模块注册表（必须先加载） -->
  <script src="js/modules/registry.js"></script>
  <!-- 练习模块：新增模块时在下方添加一行 <script src="js/modules/xxx.js"></script> -->
  <script src="js/modules/addition.js"></script>
  <!-- 应用外壳 -->
  <script src="js/app.js"></script>
</body>
</html>

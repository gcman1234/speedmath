<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EBF7EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>速算练习</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">

    <!-- 模块选择页 -->
    <section id="screen-modules" class="screen active">
      <span class="app-version" id="app-version"></span>
      <p class="egg-line" id="egg-line">点击下方按钮<span class="egg-anchor"><span class="egg-fly" id="egg-fly">立刻</span>上岸</span></p>
      <div class="logo" id="logo">算</div>
      <h1>速算练习</h1>
      <p class="subtitle">选择一个模块开始练习</p>
      <div class="module-grid" id="module-grid"></div>
    </section>

    <!-- 答题页（布局高度还原参考图） -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-top">
        <button class="btn-quit" id="btn-quit" aria-label="退出">←</button>
        <span id="progress">1 / 10</span>
        <span class="timer">⏱ <span id="timer">0:00</span></span>
      </div>

      <div class="question-wrap">
        <div class="question" id="question"></div>
        <div class="feedback" id="feedback"></div>
        <div class="grade-line" id="grade-line"></div>
      </div>

      <div class="action-row" id="action-row">
        <button class="round-btn" id="btn-restart">重开</button>
        <div class="toggle-col">
          <button class="btn-pill" id="btn-strict" style="display:none">精确模式</button>
          <button class="btn-pill" id="btn-oneshot" style="display:none">一次性输入</button>
          <button class="btn-pill" id="btn-format" style="display:none">竖式</button>
        </div>
        <button class="round-btn" id="btn-ok">确定</button>
      </div>

      <!-- 键盘输入型：固定键盘面板 -->
      <div class="keypad-wrap" id="keypad-wrap">
        <div class="keypad-mask" id="keypad-mask">点击开始输入答案</div>
        <div class="keypad" id="keypad">
          <button class="key" data-k="sign">±</button>
          <button class="key" data-k="clear">清空</button>
          <button class="key" data-k="del">退格</button>
          <button class="key" data-k="1">1</button>
          <button class="key" data-k="2">2</button>
          <button class="key" data-k="3">3</button>
          <button class="key" data-k="4">4</button>
          <button class="key" data-k="5">5</button>
          <button class="key" data-k="6">6</button>
          <button class="key" data-k="7">7</button>
          <button class="key" data-k="8">8</button>
          <button class="key" data-k="9">9</button>
          <button class="key" data-k=".">.</button>
          <button class="key" data-k="0">0</button>
          <button class="key" data-k="ok">确定</button>
        </div>
      </div>

      <!-- 四选一型（选择题模块用） -->
      <div class="choices" id="choices"></div>
    </section>

    <!-- 模块设置页（声明了 setup 的模块先进入此屏，如多数相加选择个数） -->
    <section id="screen-setup" class="screen">
      <h2 id="setup-title">练习设置</h2>
      <p class="subtitle" id="setup-hint"></p>
      <div class="setup-chips" id="setup-chips"></div>
      <button class="btn btn-primary" id="btn-setup-start">开始练习</button>
      <button class="btn btn-secondary" id="btn-setup-back">返回</button>
    </section>

    <!-- 结算页（布局还原结算参考图） -->
    <section id="screen-result" class="screen">
      <h2 id="result-title">本局成绩</h2>
      <p class="result-sub" id="result-sub"></p>
      <div class="result-table-wrap">
        <div class="result-row result-head">
          <span class="row-no"></span>
          <span class="row-q">题目</span>
          <span class="row-a">正确答案</span>
          <span class="row-u">你的答案</span>
          <span class="row-t"></span>
        </div>
        <div id="result-list"></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-key" id="btn-again">重来</button>
        <button class="btn btn-key" id="btn-home">返回</button>
      </div>
    </section>

  </main>

  <!-- 查表弹层（模块声明 cheatSheet 时，答题页右侧圆钮变为"查表"） -->
  <div class="sheet-overlay" id="sheet-overlay">
    <div class="sheet-card">
      <div class="sheet-head">
        <span id="sheet-title">对照表</span>
        <button class="sheet-close" id="sheet-close" aria-label="关闭">✕</button>
      </div>
      <div class="sheet-cols" id="sheet-cols"></div>
      <button class="btn btn-key sheet-foot" id="sheet-confirm">关闭</button>
    </div>
  </div>

  <!-- 模块注册表（必须先加载） -->
  <script src="js/modules/registry.js"></script>
  <!-- 练习模块：新增模块时在下方添加一行 <script src="js/modules/xxx.js"></script> -->
  <script src="js/modules/multiadd.js"></script>
  <script src="js/modules/baihuafen.js"></script>
  <script src="js/modules/baihuafen-est.js"></script>
  <script src="js/modules/sudoku5.js"></script>
  <!-- 应用外壳 -->
  <script src="js/app.js"></script>
</body>
</html>
